<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  .dm {
    position: absolute;
    left: 100vw;
    white-space: nowrap;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 4px rgba(0,0,0,.9), 0 2px 3px rgba(0,0,0,.9);
    will-change: transform;
  }
  .dm .who { opacity: .85; margin-right: .4em; font-weight: 500; }
  .dm .sym { margin-right: .25em; }
  .sym.push { color: #7CFC00; }
  .sym.boo  { color: #ff5252; }
  .sym.arrow{ color: #bbb; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const settings = {
    fontSize: 30,      // px
    speed: 170,        // px/s
    opacity: 1.0,
    areaRatio: 0.72,   // 彈幕使用畫面上方多少比例
    showBoo: true,
    showArrow: true,
  };

  // ---- 車道管理:避免彈幕互相重疊 ----
  let lanes = [];
  function rebuildLanes() {
    const laneH = settings.fontSize * 1.5;
    const count = Math.max(1, Math.floor(window.innerHeight * settings.areaRatio / laneH));
    lanes = Array.from({ length: count }, () => ({ freeAt: 0, el: null }));
  }
  rebuildLanes();
  window.addEventListener('resize', rebuildLanes);

  function pickLane(now, durationMs, widthPx) {
    // 車道要等前一則的尾巴完全進入畫面才能用
    let best = 0, bestFree = Infinity;
    for (let i = 0; i < lanes.length; i++) {
      if (lanes[i].freeAt <= now) return i;
      if (lanes[i].freeAt < bestFree) { bestFree = lanes[i].freeAt; best = i; }
    }
    return best; // 全滿時挑最快空出來的,寧可稍微疊也不丟留言
  }

  function spawn(msg) {
    if (msg.ctype === '噓' && !settings.showBoo) return;
    if (msg.ctype === '→' && !settings.showArrow) return;

    const el = document.createElement('div');
    el.className = 'dm';
    el.style.fontSize = settings.fontSize + 'px';
    el.style.opacity = settings.opacity;

    const sym = document.createElement('span');
    sym.className = 'sym ' + (msg.ctype === '推' ? 'push' : msg.ctype === '噓' ? 'boo' : 'arrow');
    sym.textContent = msg.ctype;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = msg.user;
    who.style.color = msg.color || '#4fc3f7';
    const txt = document.createElement('span');
    txt.textContent = msg.content;

    el.appendChild(sym); el.appendChild(who); el.appendChild(txt);
    stage.appendChild(el);

    const w = el.offsetWidth;
    const W = window.innerWidth;
    const total = W + w;
    const durationMs = total / settings.speed * 1000;

    const now = performance.now();
    const lane = pickLane(now, durationMs, w);
    const laneH = settings.fontSize * 1.5;
    el.style.top = (lane * laneH + 8) + 'px';
    // 這則的尾巴進入畫面所需時間 = w / speed;之後車道才可再用
    lanes[lane].freeAt = now + (w / settings.speed) * 1000 + 400;

    el.animate(
      [{ transform: 'translateX(0)' }, { transform: `translateX(-${total}px)` }],
      { duration: durationMs, easing: 'linear' }
    ).onfinish = () => el.remove();
  }

  // ---- WebSocket 連線(斷線自動重連) ----
  function connect() {
    const ws = new WebSocket('ws://127.0.0.1:9737');
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'comment') spawn(msg);
      else if (msg.type === 'settings') {
        Object.assign(settings, msg.values || {});
        rebuildLanes();
      }
    };
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
