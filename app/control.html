<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>PTT 彈幕控制台</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #1c1e22; color: #e8e8e8;
    margin: 0; padding: 16px 18px; font-size: 14px;
  }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #9ecbff; }
  h2:first-child { margin-top: 0; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    border-radius: 6px; border: 1px solid #444; background: #26282e; color: #eee;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 7px 14px; border-radius: 6px; border: none;
    background: #3d6fd6; color: #fff; cursor: pointer; font-size: 13px;
  }
  button.sec { background: #3a3d44; }
  button:disabled { opacity: .5; cursor: default; }
  #status {
    padding: 8px 10px; border-radius: 6px; background: #26282e;
    border-left: 3px solid #666; margin-bottom: 4px; min-height: 18px;
  }
  #status.ready { border-color: #6fd66f; }
  #status.error { border-color: #ff5252; }
  #status.busy  { border-color: #ffb74d; }
  ul#articles { list-style: none; padding: 0; margin: 6px 0; }
  ul#articles li {
    display: flex; align-items: center; gap: 8px;
    background: #26282e; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .atitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm { background: none; border: none; color: #ff8a80; cursor: pointer; font-size: 15px; }
  label.slider { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  label.slider span:first-child { width: 68px; flex-shrink: 0; color: #aaa; }
  label.slider input { flex: 1; }
  label.chk { margin-right: 14px; }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <div id="status">連線後端中…</div>

  <h2>1. 登入 PTT</h2>
  <div class="row">
    <input id="pttid" type="text" placeholder="PTT 帳號" autocomplete="off">
    <input id="pttpw" type="password" placeholder="密碼">
  </div>
  <div class="row">
    <label class="chk"><input id="kick" type="checkbox" checked> 剔除其他登入</label>
    <button id="loginBtn">登入</button>
  </div>
  <div class="hint">帳密只送到你本機的後端(127.0.0.1),不會儲存。</div>

  <h2>2. 追蹤文章(可多篇)</h2>
  <div class="row">
    <input id="arturl" type="text" placeholder="貼上 www.ptt.cc 文章網址後按 Enter">
    <button id="addBtn" style="flex:0 0 auto">加入</button>
  </div>
  <ul id="articles"></ul>

  <h2>3. 彈幕設定</h2>
  <label class="slider"><span>字體大小</span><input id="fontSize" type="range" min="18" max="56" value="30"><b id="fontSizeV">30</b></label>
  <label class="slider"><span>速度</span><input id="speed" type="range" min="80" max="400" value="170"><b id="speedV">170</b></label>
  <label class="slider"><span>透明度</span><input id="opacity" type="range" min="30" max="100" value="100"><b id="opacityV">100</b></label>
  <label class="slider"><span>顯示範圍</span><input id="areaRatio" type="range" min="20" max="100" value="72"><b id="areaRatioV">72</b>%</label>
  <div>
    <label class="chk"><input id="showBoo" type="checkbox" checked> 顯示噓文</label>
    <label class="chk"><input id="showArrow" type="checkbox" checked> 顯示→回應</label>
  </div>

  <div class="row" style="margin-top:16px">
    <button id="demoBtn" class="sec">🎾 測試彈幕</button>
  </div>
  <div id="shortcutHint" class="hint">顯示／隱藏整個彈幕層。</div>

<script>
  const query = new URLSearchParams(location.search);
  const shortcut = query.get('shortcut') ||
    (query.get('platform') === 'darwin' ? 'Cmd+Shift+D' : 'Ctrl+Shift+D');
  let ws = null;
  let lastRecv = 0;
  let pingSentAt = 0;
  let loggingInSince = 0;
  const $ = (id) => document.getElementById(id);
  $('shortcutHint').textContent = `${shortcut} 可隨時顯示／隱藏整個彈幕層。`;

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
      return true;
    }
    // 再也不允許無聲失敗:沒連上就明講
    setStatus('error', '還沒連上後端,這個操作沒有送出。等狀態變綠再試一次。');
    return false;
  }

  function connect() {
    ws = new WebSocket('ws://127.0.0.1:9737');
    const thisWs = ws;
    ws.onopen = () => {
      lastRecv = Date.now();
      pingSentAt = 0;
      setStatus('busy', '已連上後端,讀取狀態中…');
      send({ type: 'get_status' });
    };
    ws.onmessage = (ev) => {
      lastRecv = Date.now();
      const msg = JSON.parse(ev.data);
      if (msg.type === 'status') renderStatus(msg);
    };
    ws.onclose = () => {
      if (ws !== thisWs) return; // 已被新的連線取代
      setStatus('error', '連不上後端(1.5 秒後自動重試)。後端沒啟動?');
      setTimeout(connect, 1500);
    };
    ws.onerror = () => thisWs.close();
  }

  // 心跳:每 5 秒 ping 一次;超過 12 秒沒有任何回應就視為斷線,強制重連。
  // 睡眠喚醒後若留下殭屍連線，心跳會強制重新連線。
  // 只拿「上一次 ping 之後」有沒有收到回應來判斷,計時器被延遲時才不會誤殺連線。
  setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const now = Date.now();
    if (pingSentAt && lastRecv < pingSentAt && now - pingSentAt > 12000) {
      pingSentAt = 0;
      setStatus('error', '後端沒有回應,重新連線中…');
      ws.close();
      return;
    }
    if (!pingSentAt || lastRecv >= pingSentAt) pingSentAt = now;
    send({ type: 'ping' });
  }, 5000);

  // 登入中顯示經過秒數,讓你知道不是卡死
  setInterval(() => {
    if (loggingInSince) {
      const s = Math.round((Date.now() - loggingInSince) / 1000);
      setStatus('busy', `登入 PTT 中… 已等 ${s} 秒(通常 10~30 秒)`);
    }
  }, 1000);

  function setStatus(cls, text) {
    const el = $('status');
    el.className = cls;
    el.textContent = text;
  }

  function renderStatus(msg) {
    const cls = { ready: 'ready', error: 'error', logging_in: 'busy', idle: 'busy' }[msg.state] || '';
    loggingInSince = msg.state === 'logging_in' ? (loggingInSince || Date.now()) : 0;
    $('loginBtn').disabled = msg.state === 'logging_in';
    setStatus(cls, msg.message || (msg.logged_in ? '已登入' : '尚未登入,請輸入帳號密碼'));
    const ul = $('articles');
    ul.innerHTML = '';
    for (const a of (msg.articles || [])) {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = 'dot'; dot.style.background = a.color;
      const t = document.createElement('span');
      t.className = 'atitle';
      t.textContent = `${a.title || a.url}(${a.seen} 推)`;
      t.title = a.url;
      const rm = document.createElement('button');
      rm.className = 'rm'; rm.textContent = '✕';
      rm.onclick = () => send({ type: 'remove_article', url: a.url });
      li.append(dot, t, rm);
      ul.appendChild(li);
    }
  }

  $('loginBtn').onclick = () => {
    if (!$('pttid').value || !$('pttpw').value) return setStatus('error', '請輸入帳號密碼');
    send({ type: 'login', id: $('pttid').value.trim(), pw: $('pttpw').value, kick: $('kick').checked });
  };

  function addArticle() {
    const url = $('arturl').value.trim();
    if (!url) return;
    if (send({ type: 'add_article', url })) $('arturl').value = '';
  }
  $('addBtn').onclick = addArticle;
  $('arturl').addEventListener('keydown', (e) => { if (e.key === 'Enter') addArticle(); });

  $('demoBtn').onclick = () => send({ type: 'demo' });

  const sliderKeys = ['fontSize', 'speed', 'opacity', 'areaRatio'];
  const checkKeys = ['showBoo', 'showArrow'];
  function pushSettings() {
    const values = {};
    for (const k of sliderKeys) {
      let v = Number($(k).value);
      $(k + 'V').textContent = v;
      if (k === 'opacity') v /= 100;
      if (k === 'areaRatio') v /= 100;
      values[k] = v;
    }
    for (const k of checkKeys) values[k] = $(k).checked;
    send({ type: 'settings', values });
  }
  for (const k of [...sliderKeys, ...checkKeys]) $(k).addEventListener('input', pushSettings);

  connect();
</script>
</body>
</html>
